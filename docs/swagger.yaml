definitions:
  handler.ErrorResponse:
    properties:
      message:
        type: string
      type:
        type: string
    type: object
  inputoutput.LoginInput:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: password123
        type: string
    type: object
  inputoutput.LoginOutput:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      type:
        example: Bearer
        type: string
    type: object
  inputoutput.ProfessorProfileOutput:
    properties:
      department:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
      university:
        type: string
      user_id:
        type: string
    type: object
  inputoutput.RefreshInput:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  inputoutput.RefreshOutput:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      type:
        example: Bearer
        type: string
    type: object
  inputoutput.RegisterInput:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
  inputoutput.RegisterOutput:
    properties:
      message:
        type: string
      user_id:
        type: string
    type: object
  inputoutput.RegisterProfessorInput:
    properties:
      department:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
      university:
        type: string
    type: object
  inputoutput.RegisterStudentInput:
    properties:
      department:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
      research_interests:
        type: string
      role:
        type: string
