definitions:
  inputoutput.ApplyProjectInput:
    properties:
      message:
        type: string
    type: object
  inputoutput.CheckApplicationStatusOutput:
    properties:
      exists:
        type: boolean
    type: object
  inputoutput.CreateProjectInput:
    properties:
      description:
        type: string
      slots:
        type: integer
      title:
        type: string
    type: object
  inputoutput.EmptyOutput:
    properties:
      message:
        type: string
    type: object
  inputoutput.ListApplicationsOutput:
    properties:
      applications:
        items:
          $ref: '#/definitions/inputoutput.ProjectApplicationOutput'
        type: array
    type: object
  inputoutput.ListInvitationsOutput:
    properties:
      invitations:
        items:
          $ref: '#/definitions/inputoutput.ProjectInvitationOutput'
        type: array
    type: object
  inputoutput.ListMembersOutput:
    properties:
      members:
        items:
          $ref: '#/definitions/inputoutput.ProjectMemberOutput'
        type: array
    type: object
  inputoutput.ListMyProjectsOutput:
    properties:
      memberships:
        items:
          $ref: '#/definitions/inputoutput.ProjectMemberOutput'
        type: array
    type: object
  inputoutput.ListProjectApplicationsByProjectOutput:
    properties:
      approved_applications:
        items:
          $ref: '#/definitions/inputoutput.ProjectApplicationOutput'
        type: array
      pending_applications:
        items:
          $ref: '#/definitions/inputoutput.ProjectApplicationOutput'
        type: array
    type: object
  inputoutput.ListProjectsOutput:
    properties:
      projects:
        items:
          $ref: '#/definitions/inputoutput.ProjectOutput'
        type: array
    type: object
  inputoutput.ListStudentsOutput:
    properties:
      students:
        items:
          $ref: '#/definitions/inputoutput.ProjectStudentBrief'
        type: array
    type: object
  inputoutput.LoginInput:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: password123
        type: string
    type: object
  inputoutput.LoginOutput:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      role:
        example: student
        type: string
      type:
        example: Bearer
        type: string
    type: object
  inputoutput.ProfessorProfileOutput:
    properties:
      department:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
      university:
        type: string
      user_id:
        type: string
    type: object
  inputoutput.ProjectApplicationOutput:
    properties:
      id:
        type: string
      message:
        type: string
      project:
        $ref: '#/definitions/inputoutput.ProjectShortForApp'
      status:
        type: string
      student:
        $ref: '#/definitions/inputoutput.ProjectStudentBrief'
    type: object
  inputoutput.ProjectInvitationOutput:
    properties:
      id:
        type: string
      message:
        type: string
      project:
        $ref: '#/definitions/inputoutput.ProjectShortForApp'
      responded_at:
        type: string
      status:
        type: string
      student:
        $ref: '#/definitions/inputoutput.ProjectStudentBrief'
    type: object
  inputoutput.ProjectMemberOutput:
    properties:
      id:
        type: string
      joined_at:
        type: string
      left_at:
        type: string
      project:
        $ref: '#/definitions/inputoutput.ProjectShortForApp'
      source:
        type: string
      source_ref_id:
        type: string
      status:
        type: string
      student:
        $ref: '#/definitions/inputoutput.ProjectStudentBrief'
    type: object
  inputoutput.ProjectOutput:
    properties:
      description:
        type: string
      id:
        type: string
      professor:
        $ref: '#/definitions/inputoutput.ProjectProfessorBrief'
      professor_id:
        type: string
      slots:
        type: integer
      status:
        type: string
      title:
        type: string
    type: object
  inputoutput.ProjectProfessorBrief:
    properties:
      department:
        type: string
      email:
        type: string
      name:
        type: string
      university:
        type: string
      user_id:
        type: string
    type: object
  inputoutput.ProjectShortForApp:
    properties:
      description:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  inputoutput.ProjectStudentBrief:
    properties:
      department:
        type: string
      email:
        type: string
      name:
        type: string
      research_interests:
        type: string
      student_id:
        type: string
      university:
        type: string
      user_id:
        type: string
    type: object
  inputoutput.RefreshInput:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  inputoutput.RefreshOutput:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      type:
        example: Bearer
        type: string
    type: object
  inputoutput.RegisterInput:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
  inputoutput.RegisterOutput:
    properties:
      message:
        type: string
      user_id:
        type: string
    type: object
  inputoutput.RegisterProfessorInput:
    properties:
      department:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
      university:
        type: string
    type: object
  inputoutput.RegisterStudentInput:
    properties:
      department:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
      research_interests:
        type: string
      role:
        type: string
      university:
        type: string
    type: object
  inputoutput.RespondInvitationInput:
    properties:
      status:
        type: string
    type: object
  inputoutput.ReviewApplicationInput:
    properties:
      status:
        type: string
    type: object
  inputoutput.SendInvitationInput:
    properties:
      message:
        type: string
      student_id:
        type: string
    type: object
  inputoutput.StudentProfileOutput:
    properties:
      department:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      research_interests:
        type: string
      role:
        type: string
      university:
        type: string
      user_id:
        type: string
    type: object
  shared_handler.ErrorResponse:
    properties:
      message:
        type: string
      type:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/inputoutput.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.LoginOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      summary: Login user
      tags:
      - Auth
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a new access + refresh token
        pair
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/inputoutput.RefreshInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.RefreshOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      summary: Refresh access token
      tags:
      - Auth
  /api/auth/register/admin:
    post:
      consumes:
      - application/json
      description: Create a new admin account with email, name, and password
      parameters:
      - description: Admin registration credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/inputoutput.RegisterInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.RegisterOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      summary: Register admin user
      tags:
      - Auth
  /api/auth/register/professor:
    post:
      consumes:
      - application/json
      description: Create a new professor account with email, name, password, university,
        and department
      parameters:
      - description: Professor registration credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/inputoutput.RegisterProfessorInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.RegisterOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      summary: Register professor user
      tags:
      - Auth
  /api/auth/register/student:
    post:
      consumes:
      - application/json
      description: Create a new student account with email, name, password, university,
        department, and research interests
      parameters:
      - description: Student registration credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/inputoutput.RegisterStudentInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.RegisterOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      summary: Register student user
      tags:
      - Auth
  /api/professor/profile:
    get:
      description: Returns the authenticated professor's profile derived from JWT
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.ProfessorProfileOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get professor profile
      tags:
      - Professor
  /api/professor/projects:
    post:
      consumes:
      - application/json
      description: Professor creates a new project. The professor_id is sourced from
        the JWT.
      parameters:
      - description: Project payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/inputoutput.CreateProjectInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/inputoutput.ProjectOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a project
      tags:
      - Professor
  /api/professor/projects/{id}/applications:
    get:
      description: Professor lists applications for a project they own.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.ListProjectApplicationsByProjectOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List applications for a project
      tags:
      - Professor
  /api/professor/projects/{id}/applications/{appId}:
    patch:
      consumes:
      - application/json
      description: Professor approves or rejects an application on a project they
        own.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Application ID
        in: path
        name: appId
        required: true
        type: string
      - description: Review payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/inputoutput.ReviewApplicationInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.ProjectApplicationOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Approve or reject an application
      tags:
      - Professor
  /api/professor/projects/{id}/invitations:
    get:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.ListInvitationsOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List invitations sent for a project
      tags:
      - Professor
    post:
      consumes:
      - application/json
      description: Professor sends an invitation to a student for a project they own.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Invitation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/inputoutput.SendInvitationInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/inputoutput.ProjectInvitationOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Invite a student to a project
      tags:
      - Professor
  /api/professor/projects/{id}/invitations/{invId}:
    delete:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Invitation ID
        in: path
        name: invId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.EmptyOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancel a pending invitation
      tags:
      - Professor
  /api/professor/projects/{id}/members/{memberId}:
    delete:
      description: Professor removes a member from a project they own. Frees the slot.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Member ID
        in: path
        name: memberId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.EmptyOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove a member from a project
      tags:
      - Professor
  /api/professor/students:
    get:
      description: Returns the directory of students. Used by the frontend to pick
        whom to invite.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.ListStudentsOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all students
      tags:
      - Professor
  /api/projects:
    get:
      description: Returns all projects available for students to browse.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.ListProjectsOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all projects
      tags:
      - Project
  /api/projects/{id}:
    get:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.ProjectOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a project by id
      tags:
      - Project
  /api/projects/{id}/members:
    get:
      description: Returns the roster of students who joined the project — via approved
        application or accepted invitation.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.ListMembersOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List members of a project
      tags:
      - Project
  /api/student/applications:
    get:
      description: Student lists their own applications across all projects.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.ListApplicationsOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my applications
      tags:
      - Student
  /api/student/invitations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.ListInvitationsOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my invitations
      tags:
      - Student
  /api/student/invitations/{invId}:
    patch:
      consumes:
      - application/json
      description: Student accepts or declines an invitation. On accept, the student
        is added as a project member.
      parameters:
      - description: Invitation ID
        in: path
        name: invId
        required: true
        type: string
      - description: Response payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/inputoutput.RespondInvitationInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.ProjectInvitationOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Accept or decline an invitation
      tags:
      - Student
  /api/student/profile:
    get:
      description: Returns the authenticated student's profile derived from JWT
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.StudentProfileOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get student profile
      tags:
      - Student
  /api/student/projects:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.ListMyProjectsOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List projects I am a member of
      tags:
      - Student
  /api/student/projects/{id}/applications:
    get:
      description: Check application status if pending or accepted.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inputoutput.CheckApplicationStatusOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List applications for a specific project
      tags:
      - Student
    post:
      consumes:
      - application/json
      description: Student applies to a project. Status is set to pending.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
